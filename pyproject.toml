[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bundesregierung-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for bundesregierung.de — press releases, articles, speeches & search of the German federal government (no key)"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
bundesregierung-mcp = "bundesregierung_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bundesregierung_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real www.bundesregierung.de listing and document pages"]
